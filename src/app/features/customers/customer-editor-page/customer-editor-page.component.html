<ng-container *ngIf="vm$ | async as vm">
  <a routerLink="/customers" class="btn btn-link px-0 mb-2">← Back to customers</a>
  <h1 class="h3 mb-3">{{ vm.mode === 'edit' ? 'Edit customer' : 'Add customer' }}</h1>

  <div *ngIf="vm.state === 'loading'" class="text-center py-5" role="status">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <p class="mt-3 mb-0">Loading customer…</p>
  </div>

  <div *ngIf="vm.state === 'error'" class="alert alert-danger" role="alert">
    We could not load this customer. <a routerLink="/customers" class="alert-link">Return to the list</a>.
  </div>

  <div *ngIf="vm.state === 'ready'" class="card shadow-sm">
    <div class="card-body">
      <app-customer-form
        [customer]="vm.customer"
        [saving]="saving"
        [cities]="(cities$ | async) ?? []"
        (save)="onSave($event, vm.customer)"
        (cancel)="onCancel(vm.customer)"
      ></app-customer-form>
    </div>
  </div>
</ng-container>
