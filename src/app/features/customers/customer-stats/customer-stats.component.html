<div class="row g-3" role="list" aria-label="Customer summary">
  <div class="col-6 col-lg-3" role="listitem" *ngFor="let card of cards; trackBy: trackByLabel">
    <div class="card h-100 shadow-sm stat-card" [ngClass]="'stat-' + card.tone">
      <div class="card-body">
        <div class="small text-muted">{{ card.label }}</div>
        <div class="display-6 fw-semibold">{{ card.value ?? '–' }}</div>
      </div>
    </div>
  </div>
</div>
