<div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
  <div class="d-flex flex-wrap align-items-center gap-2">
    <label for="page-size" class="form-label mb-0 small">Rows per page</label>
    <select id="page-size" class="form-select form-select-sm w-auto" [formControl]="pageSizeControl">
      <option *ngFor="let size of pageSizes" [ngValue]="size">{{ size }}</option>
    </select>
    <span class="small text-muted" aria-live="polite">
      Showing {{ firstItem }}–{{ lastItem }} of {{ totalCount }}
    </span>
  </div>

  <nav aria-label="Customer pages">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="page <= 1">
        <button type="button" class="page-link" [disabled]="page <= 1" (click)="goTo(page - 1)">Previous</button>
      </li>
      <li *ngFor="let p of pages" class="page-item" [class.active]="p === page">
        <button
          type="button"
          class="page-link"
          [attr.aria-label]="'Page ' + p"
          [attr.aria-current]="p === page ? 'page' : null"
          (click)="goTo(p)"
        >
          {{ p }}
        </button>
      </li>
      <li class="page-item" [class.disabled]="page >= totalPages">
        <button type="button" class="page-link" [disabled]="page >= totalPages" (click)="goTo(page + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
